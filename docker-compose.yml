services:

  postgres:
    image: postgres:17
    container_name: stamp-postgres

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    container_name: stamp-redis

    ports:
      - "6379:6379"

volumes:
  postgres_data:
